services:
  geodata-extractor-fe-dev:
    image: registry.urbreath.tech/geocacher-fe:0.1.28
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_HREF: /
    ports:
      - '4200:80'
    volumes:
      #- ./src/assets/config.json:/usr/share/nginx/html/assets/config.json
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - geodata-extractor-network
      - web
    profiles:
      - dev
    environment:
      API_URL: https://geocacher-api-dev.urbreath.tech
      KEYCLOAK_URL: https://keycloak-dev.urbreath.tech/auth
      KEYCLOAK_REALM: urbreath-auth
      KEYCLOAK_CLIENT_ID: urbreath

  geodata-extractor-fe-prod:
    build:
      context: .
      dockerfile: Dockerfile-prod
      args:
        BASE_HREF: /
    ports:
      - '18089:80'
    volumes:
      - ./src/assets/config.json:/usr/share/nginx/html/assets/config.json
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - geodata-extractor-network
      - web
    profiles:
      - prod
    environment:
      API_URL: https://geocacher-api-dev.urbreath.tech
      KEYCLOAK_URL: http://192.168.1.196:8085
      KEYCLOAK_REALM: master
      KEYCLOAK_CLIENT_ID: geodata-ui

networks:
  geodata-extractor-network:
    driver: bridge
  web:
    driver: bridge
