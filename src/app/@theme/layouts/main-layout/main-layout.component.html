<nb-layout windowMode>
  <nb-layout-column style="padding: 0">
    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="logo">
          <img src="../../../../assets/images/URBREATH_logo.png" alt="URBREATH Logo" />
        </div>
        <div class="header-actions">
          <nb-select 
            class="icon-only-select"
            [selected]="currentLanguage" 
            (selectedChange)="switchLanguage($event)" 
            status="primary" 
            shape="rectangle" 
            size="medium"
            icon="home-outline">
            <nb-option value="en">English</nb-option>
            <nb-option value="fr">Français</nb-option>
            <nb-option value="it">Italiano</nb-option>
            <nb-option value="es">Español</nb-option>
            <nb-option value="nl">Hollandse</nb-option>
            <nb-option value="fi">Suomi</nb-option>
          </nb-select>
        </div>
      </header>
      
      <!-- Main container with sidebar and content -->
      <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
          <nav>
            <ul>
              <li>
                <a routerLink="/pages/available-options" routerLinkActive="active">
                <nb-icon icon="home-outline"></nb-icon>{{ "Home" | translate }}
                </a>
              </li>
              <div class="divider"></div>
              <li>
                <a routerLink="/pages/create-layer" routerLinkActive="active">
                  <nb-icon icon="plus-circle-outline"></nb-icon>{{ "new_project" | translate }}
                </a>
              </li>
            </ul>
          </nav>
        </div>

        <!-- Main Content -->
        <div class="content">
          <!-- This is where page components will be rendered -->
          <ng-content select="router-outlet"></ng-content>
        </div>
      </div>
    </div>
  </nb-layout-column>
</nb-layout>
