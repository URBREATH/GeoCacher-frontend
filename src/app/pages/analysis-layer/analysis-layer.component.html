<nb-card>
  <nb-card-body class="card-body">
    <div class="step-container" *ngIf="!loading; else loadingMask">
      <p>{{ "Select analyses and fill required fields" | translate }}</p>

      <nb-select [placeholder]="'Select an analysis' | translate" [formControl]="selectedAnalysisControl">
        <nb-option *ngFor="let analysis of analyses" [value]="analysis.id">
          {{ getLabel(analysis.name) }}
        </nb-option>
      </nb-select>

      <div *ngIf="selectedAnalysisControl.value as selectedName">
        <div [formGroup]="analysisForms[selectedName]" class="analysis-fields">
          <div *ngFor="let field of selectedAnalysis?.fields" class="form-group">
            <label [nbTooltip]="getLabel(field.tooltip)" nbTooltipPlacement="top" *ngIf="field.tooltip" [style.text-align]="'left'">
              {{ getLabel(field.label) }}
            </label>
            <label *ngIf="!field.tooltip" [style.text-align]="'left'">
              {{ getLabel(field.label) }}
            </label>

            <div *ngIf="field.type === 'group'" [formGroupName]="field.name">
              <div *ngFor="let subField of field.fields" class="subfield">
                <label [nbTooltip]="getLabel(subField.tooltip)" nbTooltipPlacement="top" *ngIf="subField.tooltip" [style.text-align]="'left'">
                  {{ getLabel(subField.label) }}
                </label>
                <label [nbTooltip]="subField.name" nbTooltipPlacement="top" *ngIf="!subField.tooltip" [style.text-align]="'left'">
                  {{ getLabel(subField.label) }}
                </label>
                <input nbInput [type]="subField.type" [formControlName]="subField.name"
                  [placeholder]="'Enter ' + getLabel(subField.label)" />
              </div>
            </div>

            <div *ngIf="field.type === 'select' && field.multiple" class="multi-select-wrapper">
              <div class="multi-select">
                <div *ngFor="let opt of field.options" class="checkbox-row">
                  <nb-checkbox
                    [checked]="(analysisForms[selectedName].get(field.name).value || []).includes(opt.value)"
                    (checkedChange)="onMultiSelectChange(selectedName, field.name, opt.value, $event)">
                    {{ getLabel(opt.label) }}
                  </nb-checkbox>
                </div>
              </div>
            </div>

            <nb-select *ngIf="field.type === 'select' && !field.multiple" [formControlName]="field.name">
              <nb-option *ngFor="let opt of field.options" [value]="opt.value">
                {{ getLabel(opt.label) }}
              </nb-option>
            </nb-select>

            <input *ngIf="field.type === 'number'" nbInput type="number" [formControlName]="field.name"
              [placeholder]="'Enter ' + field.label"
              (input)="analysisForms[selectedAnalysisControl.value].get(field.name)?.setValue($any($event.target).valueAsNumber)" />

            <input *ngIf="field.type !== 'group' && field.type !== 'select' && field.type !== 'number'" nbInput
              [formControlName]="field.name" [placeholder]="'Enter ' + field.label" />

            <div *ngIf="analysisForms[selectedName].get(field.name)?.invalid &&
              analysisForms[selectedName].get(field.name)?.touched" class="error">
              {{ getLabel(field.label) }} is required
            </div>
          </div>
        </div>
      </div>

      <div class="map-container">
        <div class="map-frame">
          <div id="map"></div>
        </div>
      </div>

      <div class="step-buttons" style="display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem;">
        <button class="btn-primary" type="button" (click)="router.navigate(['/pages/available-options'])">
          {{ "back" | translate }}
        </button>
        <button class="btn-primary" [disabled]="!isStepValid() || isSubmitting" (click)="submitAnalysis()" type="button">
          {{ isSubmitting ? ("submitting" | translate) : ("submit" | translate) }}
        </button>
      </div>
      <div *ngIf="submitMessage" style="margin-top: 1rem; padding: 1rem; border-radius: 4px;"
        [ngClass]="submitMessage.includes('Error') ? 'alert-danger' : 'alert-success'">
        {{ submitMessage }}
      </div>
    </div>

    <ng-template #loadingMask>
      <div class="loading-mask">
        <div class="input-group" [class.spinner]="loading"></div>
      </div>
    </ng-template>
  </nb-card-body>
</nb-card>
